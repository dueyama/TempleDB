{% extends "base.html" %}

{% block title %}パスワード変更完了 | TempleDB{% endblock %}

{% block body %}

    <section class="hero">
      <div class="eyebrow">Account</div>
      <h1>パスワードを変更しました</h1>
      <p>次回以降は新しいパスワードでログインしてください。現在のログイン状態はそのまま維持されています。</p>

    <section class="panel" style="margin-top: 20px;">
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <a class="button" href="{% url 'office:home' %}">寺務ホームへ戻る</a>
        <a class="ghost-button" href="{% url 'password_change' %}">もう一度変更する</a>
      </div>
    </section>
  </div>
