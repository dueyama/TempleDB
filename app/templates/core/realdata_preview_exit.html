<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>【テスト】テスト環境の終了 | TempleDB</title>
  <style>
    body { margin: 0; padding: 12vh 24px; background: #e7f1fa; color: #17324d; font-family: sans-serif; line-height: 1.8; }
    main { max-width: 640px; margin: auto; padding: 24px; background: #fff; border: 1px solid #b2cbe0; border-radius: 12px; }
    h1 { font-size: 24px; }
  </style>
</head>
<body>
  <main id="realdata-preview-banner">
    {% if exit_error %}
      <h1>終了操作を受け付けられませんでした</h1>
      <p>すでに終了中か、この画面のテスト環境が変わっています。状態を確認してください。</p>
    {% else %}
      <h1>テスト終了を受け付けました</h1>
      {% if confirmed %}<p>確認したコードを記録し、テスト環境を停止して試験データを破棄します。</p>
      {% else %}<p>確認完了の記録を作らず、テスト環境を停止して試験データを破棄します。</p>{% endif %}
      <p>このタブを閉じてかまいません。Piの本番は引き続き利用できます。</p>
    {% endif %}
  </main>
</body>
</html>
